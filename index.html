<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--csp-->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#eceef0" />
    <meta name="description" content="Read the PDFs in your Google Drive like books. Runs entirely in your browser." />
    <title>Bookworm</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Sets the saved theme before first paint. Allowed by hash in the production CSP. -->
    <script data-boot>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('bw.settings.v1') || '{}').theme;
          var dark = matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'sepia' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>Bookworm needs JavaScript to run. Everything happens in your browser.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
