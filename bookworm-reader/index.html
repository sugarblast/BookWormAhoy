<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--csp-->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#eceef0" />
    <meta name="description" content="Read PDFs and ebooks like books. Open files from your device, Google Drive or Dropbox. Runs entirely in your browser." />
    <!-- Google Search Console: proves ownership of this site (needed for the Google OAuth branding setup). Keep it. -->
    <meta name="google-site-verification" content="lCzysjt6m9i_RoBLRugC0sQF4rwJUEUFFy1GCxFlC4E" />
    <title>Bookworm</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Sets the saved theme before first paint. Allowed by hash in the production CSP. -->
    <script data-boot>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('bw.settings.v1') || '{}').theme;
          var dark = matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'sepia' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>Bookworm needs JavaScript to run. Everything happens in your browser.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
